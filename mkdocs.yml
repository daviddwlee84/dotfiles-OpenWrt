site_name: dotfiles-OpenWrt
site_url: https://daviddwlee84.github.io/dotfiles-OpenWrt/
repo_url: https://github.com/daviddwlee84/dotfiles-OpenWrt
theme:
  name: material
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            Setup: 安裝與管理
            Shell and Starship: Shell 與 Starship
            Application egress: 按需選擇出口
            Tools: 工具與支援
            Verification: 驗證與維護
nav:
  - Home: index.md
  - Setup: setup.md
  - Tools: tools.md
  - Application egress: network.md
  - Shell and Starship: shell.md
  - Verification: verification.md
